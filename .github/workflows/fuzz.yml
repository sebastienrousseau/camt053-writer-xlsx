name: Fuzz

# Coverage-guided fuzzing of write_xlsx with Atheris
# (fuzz/fuzz_write_xlsx.py): arbitrary documents must write, and their text
# must read back as the model held it. Two minutes on every change, thirty
# weekly. A crash fails the job and the reproducer is uploaded.
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, Monday 06:30 UTC.
    - cron: "30 6 * * 1"

permissions:
  contents: read

jobs:
  atheris:
    name: Atheris (write_xlsx)
    # Atheris ships Linux x86_64 wheels only; fuzz.txt is compiled for it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install the fuzz toolchain and this package (hash-pinned)
        run: |
          pip install --require-hashes -r requirements/fuzz.txt
          pip install --no-deps -e .

      # New inputs go to a scratch corpus; the regression cases for fixed
      # bugs live in tests/test_writer.py, which every test job runs.
      - name: Fuzz
        env:
          FUZZ_SECONDS: ${{ github.event_name == 'schedule' && '1800' || '120' }}
        run: |
          set -euo pipefail
          mkdir -p crashes work
          python fuzz/fuzz_write_xlsx.py work \
            -max_total_time="$FUZZ_SECONDS" \
            -artifact_prefix=crashes/

      - name: Upload crash reproducers
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashes
          path: crashes/
